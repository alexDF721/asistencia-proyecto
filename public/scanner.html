<!DOCTYPE html>
<html>

<head>

    <title>Scanner de Asistencia</title>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            margin-top: 30px;
            background-color: #f5f5f5;
        }

        #reader {
            width: 320px;
            margin: auto;
        }

        #estado {
            margin-top: 20px;
            font-size: 22px;
            color: green;
        }

    </style>

</head>

<body>

    <h1>Escanear Código</h1>

    <div id="reader"></div>

    <div id="estado"></div>

    <script>

        let ultimoCodigo = "";

        async function onScanSuccess(decodedText) {

            // Evita escanear el mismo código muchas veces
            if (decodedText === ultimoCodigo) {
                return;
            }

            ultimoCodigo = decodedText;

            document.getElementById("estado").textContent =
                "Escaneado: " + decodedText;

            try {

                const respuesta =
                    await fetch(
                        "https://asistencia-proyecto-production.up.railway.app/api/asistencia/" + decodedText,
                        {
                            method: "POST"
                        }
                    );

                const data = await respuesta.json();

                document.getElementById("estado").textContent =
                    data.mensaje + " ✅";

            } catch (error) {

                document.getElementById("estado").textContent =
                    "Error al enviar asistencia ❌";

            }

            // Permite volver a escanear después de 3 segundos
            setTimeout(() => {
                ultimoCodigo = "";
            }, 3000);

        }

        const scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: 250
            },
            false
        );

        scanner.render(onScanSuccess);

    </script>

</body>

</html>
