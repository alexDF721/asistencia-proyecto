<!DOCTYPE html>
<html>

<head>

    <title>Scanner de Asistencia</title>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            margin-top: 30px;
        }

        #reader {
            width: 320px;
            margin: auto;
        }

        #estado {
            margin-top: 20px;
            font-size: 22px;
            color: green;
        }

    </style>

</head>

<body>

    <h1>Escanear Código</h1>

    <div id="reader"></div>

    <div id="estado"></div>

    <script>

        function onScanSuccess(decodedText) {

            document.getElementById("estado").textContent =
                "Escaneado: " + decodedText;

            fetch("https://asistencia-proyecto-production.up.railway.app/scan", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    id: decodedText
                })

            });

        }

        const scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: 250
            },
            false
        );

        scanner.render(onScanSuccess);

    </script>

</body>

</html>
