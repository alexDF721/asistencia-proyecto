<!DOCTYPE html>
<html>

<head>

    <title>Sistema de Asistencia</title>

    <style>

        body {
            font-family: Arial;
            transition: 0.3s;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .flash {
            background-color: #8cff8c;
        }

        #mensaje {
            font-size: 22px;
            color: green;
            margin-bottom: 10px;
            text-align: center;
        }

        #contador {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .curso {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px gray;
        }

        .curso h2 {
            margin-top: 0;
        }

        li {
            margin-bottom: 8px;
        }

    </style>

</head>

<body>

    <h1>Sistema de Asistencia</h1>

    <div id="mensaje"></div>

    <div id="contador">
        Presentes: 0
    </div>

    <div id="contenedor"></div>

    <script>

        let cantidadAnterior = 0;

        async function cargarPresentes() {

            const respuesta =
                await fetch('https://asistencia-proyecto-production.up.railway.app/api/asistencias');

            const data =
                await respuesta.json();

            const contenedor =
                document.getElementById('contenedor');

            contenedor.innerHTML = "";

            let cantidad = data.length;

            document.getElementById('contador').textContent =
                "Presentes: " + cantidad;

            // Agrupar por curso
            const cursos = {};

            data.forEach(alumno => {

                if (!cursos[alumno.curso]) {
                    cursos[alumno.curso] = [];
                }

                cursos[alumno.curso].push(alumno);

            });

            // Mostrar cursos
            for (let curso in cursos) {

                const divCurso =
                    document.createElement('div');

                divCurso.className = "curso";

                const titulo =
                    document.createElement('h2');

                titulo.textContent = curso;

                divCurso.appendChild(titulo);

                const lista =
                    document.createElement('ul');

                cursos[curso].forEach(alumno => {

                    const item =
                        document.createElement('li');

                    item.textContent =
                        alumno.nombre + " - " + alumno.fecha;

                    lista.appendChild(item);

                });

                divCurso.appendChild(lista);

                contenedor.appendChild(divCurso);

            }

            // EFECTO VERDE
            if (cantidad > cantidadAnterior) {

                document.body.classList.add("flash");

                document.getElementById('mensaje').textContent =
                    "Alumno registrado correctamente ✅";

                setTimeout(() => {

                    document.body.classList.remove("flash");

                    document.getElementById('mensaje').textContent =
                        "";

                }, 2000);

            }

            cantidadAnterior = cantidad;

        }

        cargarPresentes();

        setInterval(cargarPresentes, 2000);

    </script>

</body>

</html>
