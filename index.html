<!DOCTYPE html>
<html>

<head>

    <title>Sistema de Asistencia</title>

    <style>

        body {
            font-family: Arial;
            transition: 0.3s;
        }

        .flash {
            background-color: #8cff8c;
        }

        #mensaje {
            font-size: 22px;
            color: green;
            margin-bottom: 10px;
        }

        #contador {
            font-size: 24px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <h1>Sistema de Asistencia</h1>

    <div id="mensaje"></div>

    <div id="contador">
        Presentes: 0
    </div>

    <ul id="lista"></ul>

    <script>

        let cantidadAnterior = 0;

        async function cargarPresentes() {

            const respuesta =
                await fetch('https://asistencia-proyecto-production.up.railway.app/presentes');

            const data =
                await respuesta.json();

            const lista =
                document.getElementById('lista');

            lista.innerHTML = "";

            let cantidad = 0;

            for (let id in data) {

                cantidad++;

                const alumno = data[id];

                const item =
                    document.createElement('li');

                item.textContent =
                    alumno.nombre + " - " + alumno.hora;

                lista.appendChild(item);
            }

            document.getElementById('contador').textContent =
                "Presentes: " + cantidad;

            // 🟩 EFECTO VERDE
            if (cantidad > cantidadAnterior) {

                document.body.classList.add("flash");

                document.getElementById('mensaje').textContent =
                    "Alumno registrado correctamente ✅";

                setTimeout(() => {

                    document.body.classList.remove("flash");

                    document.getElementById('mensaje').textContent =
                        "";

                }, 2000);
            }

            cantidadAnterior = cantidad;
        }

        cargarPresentes();

        setInterval(cargarPresentes, 2000);

    </script>

</body>

</html>
